ArtistsChange:
  type: object
  description: Artists to add or remove. Absent fields are unchanged.
  minProperties: 1
  properties:
    add:
      type: array
      uniqueItems: true
      items:
        type: string
        format: uuid
    remove:
      type: array
      uniqueItems: true
      items:
        type: string
        format: uuid
