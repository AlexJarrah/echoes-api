Contribution:
  type: object
  required:
    - contribution_id
    - status
    - proposed
    - created_at
  properties:
    contribution_id:
      type: string
      format: uuid
    user_id:
      type: string
      format: uuid
      nullable: true
      description: Null if the user no longer exists.
    status:
      $ref: "#/components/schemas/ContributionStatus"
    changes:
      $ref: "#/components/schemas/ContributionChanges"
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time
      nullable: true
