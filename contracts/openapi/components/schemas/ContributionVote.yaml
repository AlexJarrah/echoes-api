ContributionVote:
  type: object
  required:
    - user_id
    - contribution_id
    - vote
    - created_at
  properties:
    user_id:
      type: string
      format: uuid
    contribution_id:
      type: string
      format: uuid
    vote:
      type: integer
      format: int8
      enum: [-1, 1]
    created_at:
      type: string
      format: date-time
