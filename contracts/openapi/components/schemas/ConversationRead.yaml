ConversationRead:
  type: object
  required:
    - user_id
    - conversation_id
    - latest_message_id
    - read_at
  properties:
    user_id:
      type: string
      format: uuid
    conversation_id:
      type: string
      format: uuid
    latest_message_id:
      type: integer
      format: uint64
    read_at:
      type: string
      format: date-time
