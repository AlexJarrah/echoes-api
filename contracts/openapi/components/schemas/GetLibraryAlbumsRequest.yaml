GetLibraryAlbumsRequest:
  type: object
  properties:
    existing:
      type: object
      required:
        - ids
        - timestamp
      properties:
        ids:
          type: array
          items:
            type: string
            format: uuid
        timestamp:
          type: string
          format: date-time
      description: ids will not be returned except for those updated since timestamp.
    limit:
      type: integer
      format: uint
    offset:
      type: integer
      format: uint
    order:
      type: integer
      format: uint8
      enum: [0, 1, 2, 3]
      description: |
        0=Name
        1=Duration
        2=ReleaseDate
        3=DateAdded
    descending:
      type: boolean
