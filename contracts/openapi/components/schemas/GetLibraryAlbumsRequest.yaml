GetLibraryAlbumsRequest:
  type: object
  properties:
    existing:
      type: object
      required:
        - ids
        - timestamp
      properties:
        ids:
          type: array
          items:
            type: string
            format: uuid
        timestamp:
          type: string
          format: date-time
      description: ids will not be returned except for those updated since timestamp.
    limit:
      type: integer
      format: uint
    offset:
      type: integer
      format: uint
    order:
      type: integer
      format: uint8
      enum: [0, 1, 2, 3, 4]
      description: |
        0=PlayTime
        1=Name
        2=Duration
        3=ReleaseDate
        4=DateAdded
    descending:
      type: boolean
    time_range:
      $ref: "#/components/schemas/DateTimeRange"
      description: Time range in which play statistics are calculated.
