LibraryAddTrack:
  type: object
  required:
    - track
  properties:
    track:
      $ref: "#/components/schemas/Track"
    reference_id:
      type: integer
      format: uint64
      description: Client-provided reference ID for correlation in responses.
    force_add:
      type: boolean
      default: false
      description: If true, skip deduplication and always create a new entity.
