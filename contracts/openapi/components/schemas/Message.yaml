Message:
  type: object
  required:
    - message_id
    - conversation_id
    - body
    - created_at
  properties:
    message_id:
      type: integer
      format: uint64
    conversation_id:
      type: string
      format: uuid
    user_id:
      type: string
      format: uuid
      nullable: true
      description: Null if user is deleted.
    body:
      type: string
    parent_id:
      type: integer
      format: uint64
      nullable: true
    deleted_at:
      type: string
      format: date-time
      nullable: true
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time
      nullable: true
