PlaylistRole:
  type: object
  required:
    - playlist_id
    - user_id
    - role
    - created_at
  properties:
    playlist_id:
      type: string
      format: uuid
    user_id:
      type: string
      format: uuid
    role:
      $ref: "#/components/schemas/PlaylistRoleType"
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time
      nullable: true
