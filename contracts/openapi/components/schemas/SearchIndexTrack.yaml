SearchIndexTrack:
  type: object
  required:
    - id
    - name
  properties:
    id:
      type: string
      format: uuid
    user_id:
      type: string
      format: uuid
    name:
      type: string
    seconds:
      type: integer
      format: uint16
    album_ids:
      type: array
      items:
        type: string
        format: uuid
    artist_ids:
      type: array
      items:
        type: string
        format: uuid
    audio_sha256:
      type: string
      description: SHA-256 hash of the audio data.
      pattern: "^[a-fA-F0-9]{64}$"
