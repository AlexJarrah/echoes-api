StatisticsQuery:
  type: object
  properties:
    start:
      type: string
      format: date-time
      description: Start timestamp for the time range
    end:
      type: string
      format: date-time
      description: End timestamp for the time range
    limit:
      type: integer
      format: uint32
      default: 100
      maximum: 10000
      description: Maximum number of results to return
