TopAlbumEntry:
  type: object
  required:
    - id
    - rank
    - album
    - artists
    - current
  properties:
    id:
      type: string
      format: uuid
    rank:
      type: integer
      format: uint
    album:
      $ref: "#/components/schemas/Album"
    artists:
      type: array
      items:
        $ref: "#/components/schemas/Artist"
    current:
      $ref: "#/components/schemas/EntityPlays"
    previous:
      $ref: "#/components/schemas/EntityPlays"
    change:
      $ref: "#/components/schemas/EntityChange"
