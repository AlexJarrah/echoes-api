TopTrackEntry:
  type: object
  required:
    - id
    - rank
    - track
    - album
    - artists
    - current
  properties:
    id:
      type: string
      format: uuid
    rank:
      type: integer
      format: uint
    track:
      $ref: "#/components/schemas/Track"
    album:
      $ref: "#/components/schemas/Album"
    artists:
      type: array
      items:
        $ref: "#/components/schemas/Artist"
    current:
      $ref: "#/components/schemas/TopEntityPlays"
    previous:
      $ref: "#/components/schemas/TopEntityPlays"
    change:
      $ref: "#/components/schemas/TopEntityChange"
