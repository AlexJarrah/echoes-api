TrackDetails:
  type: object
  required:
    - track
    - artists
    - albums
    - track_artists
    - album_tracks
    - album_artists
    - artist_assets
    - album_assets
  properties:
    track:
      $ref: "#/components/schemas/Track"
    artists:
      type: array
      items:
        $ref: "#/components/schemas/Artist"
    albums:
      type: array
      items:
        $ref: "#/components/schemas/Album"
    track_artists:
      type: array
      items:
        $ref: "#/components/schemas/TrackArtist"
    album_tracks:
      type: array
      items:
        $ref: "#/components/schemas/AlbumTrack"
    album_artists:
      type: array
      items:
        $ref: "#/components/schemas/AlbumArtist"
    artist_assets:
      type: array
      items:
        $ref: "#/components/schemas/ArtistAsset"
    album_assets:
      type: array
      items:
        $ref: "#/components/schemas/AlbumAsset"
