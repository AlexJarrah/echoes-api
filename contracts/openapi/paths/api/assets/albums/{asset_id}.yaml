/api/assets/albums/{asset_id}:
  get:
    operationId: getAlbumAsset
    security:
      - CookieAuth: []
    parameters:
      - name: asset_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "200":
        description: Album asset file retrieved successfully
        content:
          image/jpeg:
            schema:
              type: string
              format: binary
          image/png:
            schema:
              type: string
              format: binary
      "401":
        $ref: "#/components/responses/Unauthorized"
      "500":
        $ref: "#/components/responses/InternalServerError"
