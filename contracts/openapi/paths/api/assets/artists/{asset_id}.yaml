/api/assets/artists/{asset_id}:
  get:
    operationId: getArtistAsset
    security:
      - CookieAuth: []
    parameters:
      - name: asset_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "200":
        description: Artist asset file retrieved successfully
        headers:
          Cache-Control:
            description: Caching directive for the client/CDN
            schema:
              type: string
          ETag:
            description: Entity tag for validation/conditional requests
            schema:
              type: string
        content:
          image/jpeg:
            schema:
              type: string
              format: binary
          image/png:
            schema:
              type: string
              format: binary
      "401":
        $ref: "#/components/responses/Unauthorized"
      "500":
        $ref: "#/components/responses/InternalServerError"
