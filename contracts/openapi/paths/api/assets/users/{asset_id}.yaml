/api/assets/users/{asset_id}:
  get:
    operationId: getUserAsset
    security:
      - CookieAuth: []
    parameters:
      - name: asset_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "200":
        description: User asset file retrieved successfully
        headers:
          Cache-Control:
            description: Caching directive for the client/CDN
            schema:
              type: string
          ETag:
            description: Entity tag for validation/conditional requests
            schema:
              type: string
        content:
          image/jpeg:
            schema:
              type: string
              format: binary
          image/png:
            schema:
              type: string
              format: binary
      "401":
        $ref: "#/components/responses/Unauthorized"
      "500":
        $ref: "#/components/responses/InternalServerError"

  delete:
    operationId: deleteUserAsset
    security:
      - CookieAuth: []
    parameters:
      - name: asset_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "204":
        $ref: "#/components/responses/NoContent"
      "401":
        $ref: "#/components/responses/Unauthorized"
      "404":
        $ref: "#/components/responses/NotFound"
      "500":
        $ref: "#/components/responses/InternalServerError"

  patch:
    summary: Update user asset
    operationId: editUserAsset
    security:
      - CookieAuth: []
    parameters:
      - name: asset_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/EditUserAssetRequest"
    responses:
      "200":
        description: User asset updated successfully
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserAsset"
      "400":
        $ref: "#/components/responses/BadRequest"
      "401":
        $ref: "#/components/responses/Unauthorized"
      "404":
        $ref: "#/components/responses/NotFound"
      "500":
        $ref: "#/components/responses/InternalServerError"
