/api/contributions/{contribution_id}/votes:
  get:
    summary: Get all contribution votes
    operationId: getContributionVotes
    tags:
      - Contributions
    security:
      - CookieAuth: []
    parameters:
      - name: contribution_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "200":
        description: Votes retrieved successfully
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/ContributionVote"
      "400":
        $ref: "#/components/responses/BadRequest"
      "401":
        $ref: "#/components/responses/Unauthorized"
      "404":
        $ref: "#/components/responses/NotFound"
      "500":
        $ref: "#/components/responses/InternalServerError"

  put:
    summary: Vote on a contribution
    operationId: voteContribution
    tags:
      - Contributions
    security:
      - CookieAuth: []
    parameters:
      - name: contribution_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/VoteContributionRequest"
    responses:
      "200":
        description: Vote recorded successfully
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContributionVote"
      "400":
        $ref: "#/components/responses/BadRequest"
      "401":
        $ref: "#/components/responses/Unauthorized"
      "403":
        $ref: "#/components/responses/Forbidden"
      "404":
        $ref: "#/components/responses/NotFound"
      "500":
        $ref: "#/components/responses/InternalServerError"

  delete:
    summary: Remove vote from a contribution
    operationId: removeContributionVote
    tags:
      - Contributions
    security:
      - CookieAuth: []
    parameters:
      - name: contribution_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "204":
        $ref: "#/components/responses/NoContent"
      "400":
        $ref: "#/components/responses/BadRequest"
      "401":
        $ref: "#/components/responses/Unauthorized"
      "404":
        $ref: "#/components/responses/NotFound"
      "500":
        $ref: "#/components/responses/InternalServerError"
