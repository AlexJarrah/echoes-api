/api/conversations/{conversation_id}/messages:
  get:
    summary: Get conversation messages.
    operationId: getMessages
    tags:
      - Conversations
      - Messages
    security:
      - CookieAuth: []
    parameters:
      - name: conversation_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: before
        in: query
        schema:
          type: integer
          format: uint64
      - name: limit
        in: query
        schema:
          type: integer
          default: 50
          maximum: 100
    responses:
      "200":
        description: Messages retrieved successfully.
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/MessageDetails"
      "401":
        $ref: "#/components/responses/Unauthorized"
      "500":
        $ref: "#/components/responses/InternalServerError"
  post:
    summary: Send a conversation message.
    operationId: sendMessage
    tags:
      - Conversations
      - Messages
    security:
      - CookieAuth: []
    parameters:
      - name: conversation_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - body
            properties:
              body:
                type: string
              parent_id:
                type: integer
                format: uint64
                nullable: true
    responses:
      "200":
        description: Message sent successfully.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Message"
      "400":
        $ref: "#/components/responses/BadRequest"
      "500":
        $ref: "#/components/responses/InternalServerError"
