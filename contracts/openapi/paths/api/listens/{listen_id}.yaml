/api/listens/{listen_id}:
  get:
    summary: Get listen
    operationId: getListen
    security:
      - CookieAuth: []
    parameters:
      - name: listen_id
        in: path
        required: true
        schema:
          type: integer
          format: uint64
    responses:
      "200":
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Listen"
      "401":
        $ref: "#/components/responses/Unauthorized"
      "404":
        $ref: "#/components/responses/NotFound"
      "500":
        $ref: "#/components/responses/InternalServerError"

  delete:
    summary: Delete listen
    operationId: deleteListen
    security:
      - CookieAuth: []
    parameters:
      - name: listen_id
        in: path
        required: true
        schema:
          type: integer
          format: uint64
    responses:
      "204":
        $ref: "#/components/responses/NoContent"
      "401":
        $ref: "#/components/responses/Unauthorized"
      "404":
        $ref: "#/components/responses/NotFound"
      "500":
        $ref: "#/components/responses/InternalServerError"
