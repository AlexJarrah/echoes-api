/api/playlists/{id}/roles:
  get:
    summary: Get playlist roles
    operationId: getPlaylistRoles
    tags:
      - Playlists
      - Roles
    security:
      - CookieAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "200":
        description: Playlist roles retrieved successfully
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/PlaylistRole"
      "400":
        $ref: "#/components/responses/BadRequest"
      "401":
        $ref: "#/components/responses/Unauthorized"
      "404":
        $ref: "#/components/responses/NotFound"
      "500":
        $ref: "#/components/responses/InternalServerError"
  post:
    summary: Add playlist roles
    operationId: addPlaylistRoles
    tags:
      - Playlists
      - Roles
    security:
      - CookieAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: array
            items:
              type: object
              required:
                - user_id
                - role
              properties:
                user_id:
                  type: string
                  format: uuid
                role:
                  $ref: "#/components/schemas/PlaylistRoleType"
    responses:
      "200":
        description: Playlist roles added successfully
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/PlaylistRole"
      "400":
        $ref: "#/components/responses/BadRequest"
      "401":
        $ref: "#/components/responses/Unauthorized"
      "403":
        $ref: "#/components/responses/Forbidden"
      "404":
        $ref: "#/components/responses/NotFound"
      "409":
        $ref: "#/components/responses/Conflict"
      "500":
        $ref: "#/components/responses/InternalServerError"
