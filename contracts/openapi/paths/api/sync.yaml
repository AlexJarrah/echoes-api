/api/sync:
  post:
    summary: Compare differences between a snapshot and a provided state
    operationId: sync
    security:
      - CookieAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SyncRequest"
    responses:
      "200":
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncResponse"
      "400":
        $ref: "#/components/responses/BadRequest"
      "500":
        $ref: "#/components/responses/InternalServerError"
