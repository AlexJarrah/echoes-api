/api/user/relations:
  get:
    summary: Get user relations
    operationId: getUserRelations
    tags:
      - Relations
    security:
      - CookieAuth: []
    responses:
      "200":
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/Relation"
      "401":
        $ref: "#/components/responses/Unauthorized"
      "500":
        $ref: "#/components/responses/InternalServerError"
